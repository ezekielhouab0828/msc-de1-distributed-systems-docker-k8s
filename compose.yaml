services:
  flask-app:
    image: ezekiel59/flask-sample-app:1.0.2
    container_name: flask-app
    ports:
      - "5000:5000"
    restart: unless-stopped

    environment:
      # Exemple de variable non sensible
      FLASK_ENV: production

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.1"
          memory: "128M"